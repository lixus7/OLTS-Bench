<svg xmlns="http://www.w3.org/2000/svg" class="g" viewBox="0 0 760 334" width="760" height="334" role="img" aria-label="When the parameters change: the frozen model is only trained on TRAIN; the online model is updated at every step from VALIDATION on; the matched copy is frozen when TEST starts.">
